name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: macos-universal
            target: aarch64-apple-darwin,x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.platform }}
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev libgl1-mesa-dev
      - name: Check version for tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          version=re.search(r'^version = "([^"]+)"',Path('Cargo.toml').read_text(),re.M).group(1)
          assert os.environ['RELEASE_TAG']=='v'+version, 'Tag and workspace version differ'
          PY
      - name: Formatting and Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test DSP and plugin
        run: cargo test --workspace --release --locked
      - name: Build VST3 and CLAP
        if: runner.os != 'macOS'
        run: cargo xtask bundle reveler-rs --release --locked --target '${{ matrix.target }}'
      - name: Build universal macOS VST3 and CLAP
        if: runner.os == 'macOS'
        run: cargo xtask bundle-universal reveler-rs --release --locked
      - name: Build universal self-contained Audio Unit
        if: runner.os == 'macOS'
        run: |
          cmake -S packaging/au -B target/au -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            "-DCLAP_BUNDLE=$PWD/target/bundled/Reveler-rs.clap"
          cmake --build target/au --config Release --clean-first --parallel 3
          rm -rf 'target/bundled/Reveler-rs.component'
          cp -R 'target/au/Reveler-rs.component' 'target/bundled/Reveler-rs.component'
          codesign --force --deep --sign - 'target/bundled/Reveler-rs.component'
          for format in vst3 clap component; do
            lipo "target/bundled/Reveler-rs.$format/Contents/MacOS/Reveler-rs" -verify_arch arm64 x86_64
          done
      - name: macOS plugin host checks
        if: runner.os == 'macOS'
        run: |
          python tools/vst3_smoke.py
          python tools/clap_smoke.py
          python tools/au_smoke.py
          python tools/mac_gui_smoke.py
      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        run: python tools/package_release.py --platform '${{ matrix.platform }}'
      - name: Package macOS
        if: runner.os == 'macOS'
        run: python tools/package_release.py --platform macos-universal --au 'target/bundled/Reveler-rs.component'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reveler-rs-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reveler-rs-*
          path: release-assets
          merge-multiple: true
      - name: Publish built archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Reveler-rs $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$notes"
