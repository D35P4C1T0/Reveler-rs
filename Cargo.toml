[workspace]
members = ["crates/dsp", "crates/plugin", "xtask"]
default-members = ["crates/dsp", "crates/plugin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
